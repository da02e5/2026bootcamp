<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QA 공고 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 버그 트래커처럼 한 줄에 공고 하나. 위에 요약과 필터, 아래에 티켓 목록 */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --fg: #151A2B;
  --muted: #5A6378;
  --line: #DCE1EA;
  --accent: #2B57D6;
  --accent-soft: #E5ECFC;
  --new: #18794E;
  --new-soft: #E1F3EA;
  --warn: #B93E0B;
  --warn-soft: #FCE9DD;
  --star: #C98A00;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F121A; --surface: #171B26; --fg: #E6E9F2; --muted: #97A0B4; --line: #2A3142;
    --accent: #87A6FF; --accent-soft: #1D2847; --new: #52C690; --new-soft: #14301F;
    --warn: #FF9257; --warn-soft: #3A2114; --star: #F2B630; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F121A; --surface: #171B26; --fg: #E6E9F2; --muted: #97A0B4; --line: #2A3142;
  --accent: #87A6FF; --accent-soft: #1D2847; --new: #52C690; --new-soft: #14301F;
  --warn: #FF9257; --warn-soft: #3A2114; --star: #F2B630; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
}
.wrap {
  max-width: 980px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
  display: grid; gap: 24px;
}
header { display: grid; gap: 6px; }
h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.sub a { color: var(--accent); }

.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.stat b { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.warn b { color: var(--warn); }
.stat.new b { color: var(--new); }

.filters { display: grid; gap: 12px; }
.search {
  width: 100%; box-sizing: border-box; padding: 10px 14px; font: inherit;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg);
}
.search:focus-visible, .chip:focus-visible, select:focus-visible, .star:focus-visible, .title a:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; margin-right: 4px; }
.chip {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
select {
  font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.count { font-size: 13px; color: var(--muted); }

.list { display: grid; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start;
  padding: 14px 16px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.star {
  background: none; border: 0; padding: 2px; cursor: pointer; font-size: 18px; line-height: 1;
  color: var(--line);
}
.star[aria-pressed="true"] { color: var(--star); }
.main { min-width: 0; display: grid; gap: 6px; }
.co { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.id { font-family: var(--font-mono); font-size: 12px; }
.title { font-size: 16px; font-weight: 500; line-height: 1.4; }
.title a { color: var(--fg); text-decoration: none; }
.title a:hover { color: var(--accent); text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.easy { background: var(--new-soft); color: var(--new); border-color: transparent; font-weight: 500; }
.tag.note { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.side { display: grid; justify-items: end; gap: 6px; text-align: right; }
.dl {
  font-family: var(--font-mono); font-size: 13px; padding: 3px 9px; border-radius: 4px;
  font-variant-numeric: tabular-nums; white-space: nowrap; border: 1px solid var(--line); color: var(--muted);
}
.dl.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 500; }
.dl.closed { text-decoration: line-through; }
.reg { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.newbadge { font-size: 11px; font-weight: 700; color: var(--new); letter-spacing: 0.06em; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
footer { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }

@media (max-width: 560px) {
  .item { grid-template-columns: auto 1fr; }
  .side { grid-column: 2; justify-items: start; text-align: left; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .star { transition: background-color .15s, color .15s; }
}
body { margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>QA 공고 보드</h1>
    <p class="sub">게임잡 QA 채용 목록 1페이지 · 2026-10-16 조사 · <a href="https://www.gamejob.co.kr/Recruit/joblist?menucode=duty&amp;duty=24" target="_blank" rel="noopener">게임잡에서 보기</a></p>
  </header>

  <div class="stats" id="stats"></div>

  <section class="filters" aria-label="필터">
    <input class="search" id="q" type="search" placeholder="회사나 게임 이름으로 찾기 (예: 컴투스, 로스트아크)">
    <div class="row">
      <span class="row-label">조건</span>
      <button class="chip" id="f-easy" aria-pressed="false">🌱 신입·경력무관만</button>
      <button class="chip" id="f-full" aria-pressed="false">정규직 포함 공고만</button>
      <button class="chip" id="f-dl" aria-pressed="false">마감일 있는 것만</button>
      <button class="chip" id="f-star" aria-pressed="false">★ 관심 공고만</button>
    </div>
    <div class="row">
      <span class="row-label">지역</span>
      <select id="region" aria-label="지역">
        <option value="">전체</option>
        <option value="서울">서울</option>
        <option value="경기">경기</option>
        <option value="기타">그 외 지역</option>
      </select>
      <span class="row-label">정렬</span>
      <select id="sort" aria-label="정렬">
        <option value="reg">최신 등록순</option>
        <option value="dl">마감 임박순</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>

  <footer>
    <span>목록 화면에 나온 내용만 옮겼어요. 지원하기 전에 공고 링크에서 마감일과 자격 조건을 다시 확인하세요.</span>
    <span>"채용시"·"상시" 공고는 사람을 뽑으면 바로 닫힐 수 있어요. ★ 관심 표시는 이 브라우저에만 저장돼요.</span>
  </footer>
</div>

<script>
const SNAPSHOT = "2026-10-16";
// [등록일, 회사, 공고 제목, GI_No, 경력, 고용형태, 지역, 마감(YYYY-MM-DD | 채용시 | 상시 | ""), 메모]
const JOBS = [
  ["2026-10-16","쿡앱스","모바일게임 QA (계약직)",285938,"경력1년↑","계약직","경기 성남","채용시"],
  ["2026-10-14","게임듀오","[경력] 모바일 게임 QA",285869,"경력1년↑","정규직","경기 성남","상시"],
  ["2026-10-13","무브인터렉티브","QA팀 신입 채용",285807,"신입","정규직","경기 파주","상시"],
  ["2026-10-13","이엑스투게임즈","[Ex2게임즈] QA",285836,"경력1년↑","계약직","서울 강남","채용시"],
  ["2026-10-12","기어세컨드","모바일 게임 QA",285823,"경력3년↑","계약직","서울 성동","채용시"],
  ["2026-10-12","스마일게이트","[LOST ARK Mobile] FQA 담당",285751,"경력3년↑","정규직","경기 성남","채용시"],
  ["2026-10-12","스마일게이트","[LOST ARK Mobile] 개발QA 담당",285750,"경력1년↑","정규직","경기 성남","채용시"],
  ["2026-10-12","스마일게이트","[LOST ARK Mobile] 개발QA 담당 (계약직)",285749,"경력무관","계약직","경기 성남","채용시"],
  ["2026-10-08","스튜디오비사이드","[프로젝트 A] QA 담당자",285646,"경력무관","정규직, 계약직","경기 성남","채용시"],
  ["2026-10-08","NC","[AION2] 게임 현지화 영어 번역/검수 (LQA)",285636,"신입","단기계약직","경기 성남","2026-10-31","영어 필요"],
  ["2026-10-08","NC","[AION2] 게임 현지화 독일어 번역/검수 (LQA)",285634,"신입","단기계약직","경기 성남","2026-10-31","독일어 필요"],
  ["2026-10-07","위메이드","게임 QA (계약직)",285604,"경력무관","계약직","경기 성남","2026-10-20"],
  ["2026-10-07","컴투스","런처(PC 클라이언트) QA (계약직)",285587,"경력무관","계약직","서울 금천","상시"],
  ["2026-10-07","빅게임스튜디오","[브레이커스] QA 담당자",285609,"경력1년↑","정규직","서울 강남","채용시"],
  ["2026-10-07","슈퍼진","글로벌 캐주얼 게임 QA (계약직)",285599,"경력2년↑","계약직","경기 성남","채용시"],
  ["2026-10-01","컴투스","운영툴/확률형 아이템 QA (계약직)",285488,"경력무관","계약직","서울 금천","상시"],
  ["2026-09-29","펄어비스","하우징 콘텐츠 QA 아르바이트",285376,"경력무관","아르바이트","경기 과천","채용시"],
  ["2026-09-29","에피드게임즈","[트릭컬 리바이브] QA 담당자 추가 모집",285355,"경력무관","정규직","서울 강남","채용시"],
  ["2026-09-29","엔드나인게임즈","게임QA & 운영지원 담당자",285362,"경력무관","계약직","충남 천안","2026-10-29"],
  ["2026-09-28","러쉬에잇","클래식 메이플스토리 QA (경력 1년+)",285292,"경력1년↑","정규직, 계약직","서울 강남","채용시"],
  ["2026-09-28","하이퍼센트","[PC 게임] CS/QA 신입 채용",285265,"경력무관","정규직","경기 성남","채용시"],
  ["2026-09-23","이안게임즈","개발 QA 담당 (계약직)",285237,"경력무관","계약직","서울 강남","채용시"],
  ["2026-09-22","에이에프아이","[게임서버 뒤끝] QA 엔지니어 (경력)",285206,"경력3년↑","정규직","서울 강남","채용시"],
  ["2026-09-21","컴투스","[서머너즈워] QA 담당자 (계약직)",285146,"경력무관","계약직","서울 금천","상시"],
  ["2026-09-21","컴투스","[컴투스프로야구 시리즈] QA 담당자 (계약직)",285143,"경력무관","계약직","서울 금천","상시"],
  ["2026-09-18","민트로켓","게임플레이 QA (계약직)",285105,"경력무관","계약직","경기 성남","상시"],
  ["2026-09-16","사람인에이치에스","[역삼역/신입가능/전환가능] 게임QA",284996,"경력무관","계약직, 파견직","서울 강남·서초 외","채용시"],
  ["2026-09-10","매드엔진","FQA 담당자 (경력)",284814,"경력3년↑","정규직","경기 성남","2026-10-30"],
  ["2026-08-26","퍼니팩","모바일 방치형 게임 QA",284236,"경력무관","정규직, 계약직, 프리랜서","울산 중구","채용시"],
  ["2026-08-24","데브시스터즈","[쿠키런 크럼블] QA (1년 계약직)",284113,"경력2년↑","계약직","서울 강남","채용시"],
  ["2026-08-21","스피엘게임즈","방치형 모바일 RPG QA",284061,"경력무관","계약직, 인턴직","경기 안양","채용시"],
  ["2026-08-18","이안게임즈","개발 QA 담당",283943,"경력2년↑","정규직, 계약직","서울 강남","채용시"],
  ["2026-08-14","리튬포어스","콘솔 액션 게임 QA",283829,"경력3년↑","계약직","서울 성동","채용시"],
  ["2026-08-12","그렙게임즈","[일본 IP 게임 라이브운영] QA",283695,"경력3년↑","정규직","서울 강남","채용시"],
  ["2026-08-11","헥토큐앤엠","RPG 게임QA (경력/계약직)",283663,"경력1년↑","계약직","서울 강남","채용시"],
  ["2026-08-05","엔나인스","[단기 알바] 모바일 게임 플레이 테스터",283533,"경력무관","아르바이트","서울 성동","채용시"],
  ["","콩스튜디오코리아","[QA실] 게임 QA 담당자 (계약직)",285391,"","계약직","","","목록에 세부 정보 없음"]
].map(([reg, co, title, id, exp, type, region, dl, note]) => ({
  reg, co, title, id, exp, type, region, dl, note,
  easy: exp === "신입" || exp === "경력무관",
  url: "https://www.gamejob.co.kr/Recruit/GI_Read/View?GI_No=" + id
}));

const DAY = 86400000;
const toDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const daysLeft = j => /^\d{4}-/.test(j.dl) ? Math.round((toDate(j.dl) - today) / DAY) : null;
const isNew = j => j.reg && (toDate(SNAPSHOT) - toDate(j.reg)) / DAY <= 4;
const md = s => { const d = toDate(s); return (d.getMonth() + 1) + "/" + d.getDate(); };

let stars = new Set();
try { stars = new Set(JSON.parse(localStorage.getItem("qa-board-stars") || "[]")); } catch (e) {}
const saveStars = () => { try { localStorage.setItem("qa-board-stars", JSON.stringify([...stars])); } catch (e) {} };

const state = { q: "", easy: false, full: false, dl: false, star: false, region: "", sort: "reg" };
try { const s = JSON.parse(localStorage.getItem("qa-board-filters") || "null"); if (s) Object.assign(state, s, { q: "" }); } catch (e) {}
const saveState = () => { try { localStorage.setItem("qa-board-filters", JSON.stringify(state)); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function dlBadge(j) {
  const n = daysLeft(j);
  if (n === null) return `<span class="dl">${j.dl ? esc(j.dl) : "마감 정보 없음"}</span>`;
  if (n < 0) return `<span class="dl closed">${md(j.dl)} 마감됨</span>`;
  const label = n === 0 ? "오늘 마감" : "D-" + n;
  return `<span class="dl${n <= 7 ? " soon" : ""}">${label} · ${md(j.dl)}</span>`;
}

function renderStats() {
  const open = JOBS.filter(j => { const n = daysLeft(j); return n === null || n >= 0; });
  const soon = JOBS.filter(j => { const n = daysLeft(j); return n !== null && n >= 0 && n <= 7; }).length;
  $("stats").innerHTML = `
    <div class="stat"><b>${open.length}</b><span>모집 중</span></div>
    <div class="stat new"><b>${JOBS.filter(isNew).length}</b><span>최근 5일 새 공고</span></div>
    <div class="stat new"><b>${JOBS.filter(j => j.easy).length}</b><span>🌱 신입·경력무관</span></div>
    <div class="stat warn"><b>${soon}</b><span>7일 안에 마감</span></div>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  let rows = JOBS.filter(j =>
    (!q || (j.co + " " + j.title).toLowerCase().includes(q)) &&
    (!state.easy || j.easy) &&
    (!state.full || j.type.includes("정규직")) &&
    (!state.dl || daysLeft(j) !== null) &&
    (!state.star || stars.has(j.id)) &&
    (!state.region || (state.region === "기타"
      ? !j.region.startsWith("서울") && !j.region.startsWith("경기")
      : j.region.startsWith(state.region)))
  );
  if (state.sort === "dl") {
    const key = j => { const n = daysLeft(j); return n === null ? 9999 : n < 0 ? 10000 : n; };
    rows.sort((a, b) => key(a) - key(b) || b.reg.localeCompare(a.reg));
  } else {
    rows.sort((a, b) => b.reg.localeCompare(a.reg));
  }
  $("count").textContent = `${rows.length}건 표시`;
  $("list").innerHTML = rows.length ? rows.map(j => `
    <article class="item">
      <button class="star" data-id="${j.id}" aria-pressed="${stars.has(j.id)}" aria-label="관심 공고 표시">★</button>
      <div class="main">
        <div class="co"><span>${esc(j.co)}</span><span class="id">#${j.id}</span>${isNew(j) ? '<span class="newbadge">NEW</span>' : ""}</div>
        <div class="title"><a href="${j.url}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
        <div class="tags">
          ${j.exp ? `<span class="tag${j.easy ? " easy" : ""}">${j.easy ? "🌱 " : ""}${esc(j.exp)}</span>` : ""}
          <span class="tag">${esc(j.type)}</span>
          ${j.region ? `<span class="tag">${esc(j.region)}</span>` : ""}
          ${j.note ? `<span class="tag note">${esc(j.note)}</span>` : ""}
        </div>
      </div>
      <div class="side">
        ${dlBadge(j)}
        <span class="reg">${j.reg ? md(j.reg) + " 등록" : "등록일 없음"}</span>
      </div>
    </article>`).join("") : `<div class="empty">조건에 맞는 공고가 없어요. 필터를 하나 꺼 보세요.</div>`;
}

function syncControls() {
  for (const k of ["easy", "full", "dl", "star"]) $("f-" + k).setAttribute("aria-pressed", state[k]);
  $("region").value = state.region;
  $("sort").value = state.sort;
}

for (const k of ["easy", "full", "dl", "star"]) {
  $("f-" + k).addEventListener("click", () => { state[k] = !state[k]; saveState(); syncControls(); render(); });
}
$("region").addEventListener("change", e => { state.region = e.target.value; saveState(); render(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; saveState(); render(); });
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("list").addEventListener("click", e => {
  const b = e.target.closest(".star");
  if (!b) return;
  const id = Number(b.dataset.id);
  stars.has(id) ? stars.delete(id) : stars.add(id);
  saveStars();
  if (state.star) render(); else b.setAttribute("aria-pressed", stars.has(id));
});

syncControls();
renderStats();
render();
</script>

</body>
</html>
